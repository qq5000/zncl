version: '3.8'

services:
  zncl:
    image: ghcr.io/qq5000/zncl:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zncl_app
    restart: always
    ports:
      - "8080:8080"
    environment:
      - ZNCL_PORT=8080
      - ZNCL_ADMIN_PASSWORD=6531684
      - ZNCL_ORGCODE=blspzzzxxx
    volumes:
      # 持久化存储目录：只需要挂载 uploads 目录即可，所有音频与配置均保存在其中
      - ./uploads:/app/web/uploads
